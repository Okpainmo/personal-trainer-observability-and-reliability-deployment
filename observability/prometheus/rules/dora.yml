groups:
  - name: dora
    rules:
      - alert: ChangeFailureRateTooHigh
        expr: dora_change_failure_rate_ratio > 0.15
        for: 5m
        labels:
          severity: warning
          service: "{{ $labels.service }}"
        annotations:
          summary: "Change failure rate exceeds 15% for {{ $labels.service }}"
          current_value: "{{ printf \"%.2f\" $value }}"
          dashboard_url: "http://localhost:3000/d/dora/dora-metrics"
          runbook_url: "runbooks/change-failure-rate.md"

      - alert: MTTRTooHigh
        expr: dora_mttr_seconds > 1800
        for: 5m
        labels:
          severity: warning
          service: "{{ $labels.service }}"
        annotations:
          summary: "MTTR exceeds 30 minutes for {{ $labels.service }}"
          current_value: "{{ printf \"%.0f\" $value }} seconds"
          dashboard_url: "http://localhost:3000/d/dora/dora-metrics"
          runbook_url: "runbooks/mttr.md"
