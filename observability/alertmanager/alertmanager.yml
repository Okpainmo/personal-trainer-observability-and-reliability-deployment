global:
  resolve_timeout: 5m

templates:
  - /etc/observability-platform/alertmanager/templates/*.tmpl

route:
  receiver: slack-devops-alerts
  group_by: ["service", "alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers:
        - severity="critical"
      receiver: slack-devops-alerts
      repeat_interval: 30m
    - matchers:
        - severity="warning"
      receiver: slack-devops-alerts
      repeat_interval: 2h

inhibit_rules:
  - source_matchers:
      - alertname="HostExporterDown"
    target_matchers:
      - service="node"
    equal: ["instance"]

receivers:
  - name: slack-devops-alerts
    slack_configs:
      - api_url_file: /etc/observability-platform/secrets/slack_webhook_url
        channel: "#detrudr-alerts-demo"
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        color: '{{ template "slack.color" . }}'
