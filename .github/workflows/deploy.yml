name: deploy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Validate repository layout
        run: make validate-static

      - name: Validation confirmation
        run: echo "Static validation passed"
